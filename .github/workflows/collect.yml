name: Collect prices

on:
  schedule:
    - cron: "7 * * * *"      # every hour, at 7 minutes past
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the stores
        run: python collector/collect.py
      - name: Save the new prices
        run: |
          git config user.name "price-collector"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/prices.json collector/known_urls.json
          git diff --cached --quiet || git commit -m "Prices $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
